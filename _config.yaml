# site properties and page defaults
title: Willmund Lab – Chloroplast Biology | Uni Marburg
subtitle: 
description: The Willmund Lab at Philipps-Universität Marburg (SYNMIKRO) studies chloroplast protein biogenesis, photosystem assembly and stress resilience in algae and plants, and applies these insights to chloroplast synthetic biology.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: willmund@staff.uni-marburg.de
  orcid: 0000-0002-3988-4590
  google-scholar: xiI6o1QAAAAJ&hl
  github: Willmund-lab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
